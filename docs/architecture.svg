<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <style>
      .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
      .kind { font-size: 12px; font-weight: 600; fill: #64748b; letter-spacing: 0.6px; }
      .body { font-size: 14px; fill: #334155; }
      .small { font-size: 13px; fill: #334155; }
      .mono { font-family: Consolas, Menlo, monospace; font-size: 12px; fill: #334155; }
      .edge { font-size: 13px; font-weight: 700; fill: #334155; }
      .line { stroke: #334155; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="1040" fill="#ffffff"/>

  <!-- title -->
  <text x="30" y="46" font-size="30" font-weight="700" fill="#0f172a">Flakeproof architecture</text>
  <text x="30" y="76" class="body">Input: a known flaky test and its reproduction recipe. Output: a pull request carrying the evidence, or a refusal that names the reason.</text>

  <!-- legend -->
  <rect x="1190" y="22" width="18" height="14" rx="3" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="1216" y="34" class="small">LLM agent (Amazon Nova 2 Lite via Strands)</text>
  <rect x="1190" y="46" width="18" height="14" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="1216" y="58" class="small">Deterministic node, no model inside</text>
  <rect x="1190" y="70" width="18" height="14" rx="3" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="1216" y="82" class="small">Infrastructure</text>

  <!-- graph container -->
  <rect x="30" y="100" width="1540" height="660" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="50" y="126" font-size="15" font-weight="700" fill="#475569">STRANDS GRAPH (GraphBuilder): 7 nodes, a conditional edge out of the gate</text>

  <!-- intake -->
  <rect x="60" y="145" width="250" height="255" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="78" y="175" class="title">intake</text>
  <text x="78" y="195" class="kind">DETERMINISTIC NODE</text>
  <text x="78" y="225" class="body">Baseline: 20 reruns under</text>
  <text x="78" y="245" class="body">rotating Surefire orders,</text>
  <text x="78" y="265" class="body">before any change.</text>
  <text x="78" y="295" class="body">Captures one failure trace</text>
  <text x="78" y="315" class="body">for the agents to read.</text>

  <!-- diagnose swarm -->
  <rect x="350" y="145" width="520" height="255" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="368" y="175" class="title">diagnose</text>
  <text x="368" y="195" class="kind">STRANDS SWARM · 4 AGENTS · HANDOFFS</text>
  <rect x="535" y="208" width="150" height="34" rx="17" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="610" y="230" class="small" text-anchor="middle" font-weight="600">triage</text>
  <path d="M610,242 L443,270" class="line" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M610,242 L608,270" class="line" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M610,242 L775,270" class="line" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="365" y="272" width="155" height="34" rx="17" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="442" y="294" class="small" text-anchor="middle" font-weight="600">order_specialist</text>
  <rect x="530" y="272" width="155" height="34" rx="17" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="607" y="294" class="small" text-anchor="middle" font-weight="600">async_specialist</text>
  <rect x="695" y="272" width="160" height="34" rx="17" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="775" y="294" class="small" text-anchor="middle" font-weight="600">resource_specialist</text>
  <text x="368" y="336" class="small">tools: failure_report · read_source · search_code · list_test_classes</text>
  <text x="368" y="356" class="small">run_victim_alone · run_pair (real JVM experiments) · record_hypothesis</text>
  <text x="368" y="384" class="small">A handoff is a recorded change of hypothesis, with its evidence.</text>

  <!-- synthesize -->
  <rect x="910" y="145" width="280" height="255" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="928" y="175" class="title">synthesize</text>
  <text x="928" y="195" class="kind">AGENT</text>
  <text x="928" y="225" class="body">Weighs the hypotheses and</text>
  <text x="928" y="245" class="body">records one diagnosis:</text>
  <text x="928" y="265" class="body">category, root cause,</text>
  <text x="928" y="285" class="body">polluter, fix strategy.</text>
  <text x="928" y="320" class="small">tools: record_diagnosis</text>
  <text x="928" y="340" class="small">read_source</text>

  <!-- repair -->
  <rect x="1230" y="145" width="310" height="255" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="1248" y="175" class="title">repair</text>
  <text x="1248" y="195" class="kind">AGENT</text>
  <text x="1248" y="225" class="body">Edits the working tree,</text>
  <text x="1248" y="245" class="body">compiles, and snapshots each</text>
  <text x="1248" y="265" class="body">fix as a candidate patch.</text>
  <text x="1248" y="300" class="small">tools: read_source · search_code</text>
  <text x="1248" y="320" class="small">failure_report · edit_file</text>
  <text x="1248" y="340" class="small">compile_check · propose_candidate</text>

  <!-- row A edges -->
  <path d="M310,272 L346,272" class="line" marker-end="url(#arrow)"/>
  <path d="M870,272 L906,272" class="line" marker-end="url(#arrow)"/>
  <path d="M1190,272 L1226,272" class="line" marker-end="url(#arrow)"/>

  <!-- repair to gate -->
  <path d="M1385,400 L1385,432 L710,432 L710,461" class="line" marker-end="url(#arrow)"/>
  <text x="1040" y="424" class="edge" text-anchor="middle">agent-written candidates</text>

  <!-- planted -->
  <rect x="60" y="500" width="250" height="140" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="78" y="530" class="title">planted candidates</text>
  <text x="78" y="550" class="kind">OPTIONAL INPUT</text>
  <text x="78" y="576" class="mono">--plant "demo/candidates/*.diff"</text>
  <text x="78" y="602" class="body">Judged by the same gate</text>
  <text x="78" y="622" class="body">as the agents' patches.</text>
  <path d="M310,570 L346,570" class="line" marker-end="url(#arrow)"/>

  <!-- gate -->
  <rect x="350" y="465" width="720" height="275" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
  <text x="368" y="495" class="title">gate</text>
  <text x="368" y="515" class="kind">DETERMINISTIC NODE · THE PROOF ENGINE</text>
  <text x="368" y="540" class="body">For each candidate: reset the tree, git apply, mvn test-compile, then both blades.</text>

  <rect x="368" y="552" width="332" height="150" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="384" y="576" font-size="15" font-weight="700" fill="#0f172a">Blade 2 · real fix or mask?</text>
  <text x="384" y="598" class="small">Deterministic scanner, 8 rule families:</text>
  <text x="384" y="616" class="small">sleep, retry, ignore, timeout, order</text>
  <text x="384" y="634" class="small">pinning, fork isolation, weakened or</text>
  <text x="384" y="652" class="small">swallowed assertions. Then a band-aid</text>
  <text x="384" y="670" class="small">judge agent (structured output) can add</text>
  <text x="384" y="688" class="small">a refusal. It cannot overrule a scanner hit.</text>

  <rect x="720" y="552" width="332" height="150" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="736" y="576" font-size="15" font-weight="700" fill="#0f172a">Blade 1 · does it hold?</text>
  <text x="736" y="598" class="small">N reruns (200 in the demo), polluter</text>
  <text x="736" y="616" class="small">pinned at method level, under rotating</text>
  <text x="736" y="634" class="small">Surefire orders. Reads the Surefire XML,</text>
  <text x="736" y="652" class="small">never the exit code. Skipped counts</text>
  <text x="736" y="670" class="small">as failed. 0 failures in 200 bounds the</text>
  <text x="736" y="688" class="small">failure rate below 1.5% (rule of three).</text>

  <text x="368" y="726" font-size="13" font-weight="700" fill="#166534">VERIFIED only if Blade 2 is CLEAN and every rerun passes. Otherwise REFUSED_BANDAID or REFUSED_UNPROVEN.</text>

  <!-- gate out edges -->
  <path d="M1070,560 L1156,532" class="line" marker-end="url(#arrow)"/>
  <text x="1113" y="524" class="edge" text-anchor="middle">VERIFIED</text>
  <path d="M1070,660 L1156,684" class="line" marker-end="url(#arrow)"/>
  <text x="1113" y="706" class="edge" text-anchor="middle">otherwise</text>

  <!-- open_pr -->
  <rect x="1160" y="465" width="380" height="145" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="1178" y="495" class="title">open_pr</text>
  <text x="1178" y="515" class="kind">AGENT · PR_WRITER · ONLY NODE WITH THE PR TOOL</text>
  <text x="1178" y="539" class="body">Calls open_pull_request; the evidence</text>
  <text x="1178" y="558" class="body">table is attached automatically. The</text>
  <text x="1178" y="577" class="body">RefusalGuard hook re-checks the verdict in</text>
  <text x="1178" y="596" class="body">the database and cancels the call if needed.</text>

  <!-- refuse -->
  <rect x="1160" y="625" width="380" height="115" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="1178" y="655" class="title">refuse</text>
  <text x="1178" y="675" class="kind">DETERMINISTIC NODE</text>
  <text x="1178" y="701" class="body">States the verdict, the failing blade and</text>
  <text x="1178" y="721" class="body">the offending line. No pull request.</text>

  <!-- infrastructure connectors -->
  <path d="M215,760 L215,800" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M605,760 L605,800" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M990,760 L990,800" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M1380,760 L1380,800" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>

  <!-- infrastructure -->
  <rect x="30" y="800" width="370" height="160" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="48" y="830" class="title">Amazon Bedrock</text>
  <text x="48" y="856" class="body">Amazon Nova 2 Lite</text>
  <text x="48" y="876" class="mono">us.amazon.nova-2-lite-v1:0</text>
  <text x="48" y="902" class="body">Every agent, through the Strands</text>
  <text x="48" y="922" class="body">BedrockModel provider.</text>

  <rect x="420" y="800" width="370" height="160" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="438" y="830" class="title">Target Java project</text>
  <text x="438" y="856" class="body">marine-api, checked out at the parent</text>
  <text x="438" y="876" class="body">of the upstream fix commit.</text>
  <text x="438" y="902" class="body">JDK 11, Maven 3.9, Surefire.</text>
  <text x="438" y="922" class="body">About 3.6 s per JVM run (measured).</text>

  <rect x="810" y="800" width="360" height="160" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="828" y="830" class="title">SQLite (data/runs.db)</text>
  <text x="828" y="856" class="body">attempts · candidates · runs</text>
  <text x="828" y="876" class="body">hypotheses · events · gate_checks</text>
  <text x="828" y="902" class="body">Every run and agent step, read live</text>
  <text x="828" y="922" class="body">by the web UI through /api/replay.</text>

  <rect x="1190" y="800" width="380" height="160" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="1208" y="830" class="title">GitHub REST API</text>
  <text x="1208" y="856" class="body">Branch, commit and pull request on</text>
  <text x="1208" y="876" class="body">the user's fork, created through the</text>
  <text x="1208" y="896" class="body">API with one fine-grained token.</text>
  <text x="1208" y="922" class="body">The PR body carries the evidence.</text>

  <!-- footer -->
  <text x="30" y="1005" font-size="16" font-weight="700" fill="#0f172a">8 LLM agents (4-agent swarm, synthesizer, repair, pr_writer, band-aid judge) · 3 deterministic nodes · 12 tools · 2 locks on the pull request</text>
</svg>
